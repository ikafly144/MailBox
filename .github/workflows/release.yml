name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Gradle properties
        id: gradle-props
        run: |
          echo "java_version=$(grep '^javaVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.gradle-props.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Publish plugin release
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          RELEASE_CHANGELOG: ${{ github.event.head_commit.message || format('Automated release for {0}', github.ref_name) }}
        run: ./gradlew publishPluginRelease --stacktrace
