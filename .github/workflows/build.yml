name: Build

on:
  push:
    branches:
      - master
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - development
      modrinth_version_type:
        description: Override Modrinth version type (release/beta/alpha)
        required: false
        default: ""
        type: string
      hangar_channel:
        description: Override Hangar channel
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      java_version: ${{ steps.gradle-props.outputs.java_version }}
      build_mode: ${{ steps.config.outputs.build_mode }}
      plugin_version: ${{ steps.config.outputs.plugin_version }}
      modrinth_version_type: ${{ steps.config.outputs.modrinth_version_type }}
      hangar_channel: ${{ steps.config.outputs.hangar_channel }}
      channel_key: ${{ steps.config.outputs.channel_key }}
      modrinth_project_id: ${{ steps.gradle-props.outputs.modrinth_project_id }}
      hangar_project_id: ${{ steps.gradle-props.outputs.hangar_project_id }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Gradle properties
        id: gradle-props
        run: |
          echo "java_version=$(grep '^javaVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "base_plugin_version=$(grep '^pluginVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "modrinth_project_id=$(grep '^modrinthProjectId=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "hangar_project_id=$(grep '^hangarProjectId=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Resolve build and release settings
        id: config
        env:
          BASE_PLUGIN_VERSION: ${{ steps.gradle-props.outputs.base_plugin_version }}
          INPUT_BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || '' }}
          INPUT_MODRINTH_VERSION_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.modrinth_version_type || '' }}
          INPUT_HANGAR_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.hangar_channel || '' }}
        run: |
          if [ -n "$INPUT_BUILD_MODE" ]; then
            build_mode="$INPUT_BUILD_MODE"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            build_mode="release"
          else
            build_mode="development"
          fi

          if [ "$build_mode" = "development" ]; then
            plugin_version="${BASE_PLUGIN_VERSION}+build.${GITHUB_RUN_NUMBER}"
            default_modrinth_version_type="alpha"
            default_hangar_channel="Alpha"
          else
            plugin_version="${BASE_PLUGIN_VERSION}"
            default_modrinth_version_type="release"
            default_hangar_channel="Release"
          fi

          modrinth_version_type="${INPUT_MODRINTH_VERSION_TYPE:-$default_modrinth_version_type}"
          hangar_channel="${INPUT_HANGAR_CHANNEL:-$default_hangar_channel}"
          channel_key="$(echo "$hangar_channel" | tr '[:lower:]' '[:upper:]' | sed -E 's/[^A-Z0-9]+/_/g' | sed -E 's/^_+|_+$//g')"
          if [ -z "$channel_key" ]; then
            channel_key="DEFAULT"
          fi

          echo "build_mode=$build_mode" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"
          echo "modrinth_version_type=$modrinth_version_type" >> "$GITHUB_OUTPUT"
          echo "hangar_channel=$hangar_channel" >> "$GITHUB_OUTPUT"
          echo "channel_key=$channel_key" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: resolve-config
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.resolve-config.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build plugin
        run: >
          ./gradlew :mailbox-paper:build --stacktrace
          -PpluginVersion=${{ needs.resolve-config.outputs.plugin_version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mailbox-paper-${{ needs.resolve-config.outputs.plugin_version }}
          path: |
            paper/build/libs/*.jar
          if-no-files-found: error

  publish:
    needs: resolve-config
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.resolve-config.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Publish plugin release
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          RELEASE_CHANGELOG: ${{ needs.resolve-config.outputs.changelog || github.event.head_commit.message || format('Automated release for {0}', github.ref_name) }}
        run: >
          ./gradlew publishPluginRelease --stacktrace
          -PpluginVersion=${{ needs.resolve-config.outputs.plugin_version }}
          -PmodrinthVersionType=${{ needs.resolve-config.outputs.modrinth_version_type }}
          -PhangarChannel=${{ needs.resolve-config.outputs.hangar_channel }}

  notify-discord:
    needs:
      - resolve-config
      - publish
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && needs.publish.result == 'success' && needs.publish-api.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send changelog to Discord
        env:
          CHANNEL_KEY: ${{ needs.resolve-config.outputs.channel_key }}
          RELEASE_CHANNEL: ${{ needs.resolve-config.outputs.hangar_channel }}
          RELEASE_VERSION: ${{ needs.resolve-config.outputs.plugin_version }}
          MODRINTH_PROJECT_ID: ${{ needs.resolve-config.outputs.modrinth_project_id }}
          HANGAR_PROJECT_ID: ${{ needs.resolve-config.outputs.hangar_project_id }}
          CHANGELOG: ${{ needs.resolve-config.outputs.changelog || github.event.head_commit.message || format('Automated release for {0}', github.ref_name) }}
          WEBHOOK_URL_SECRET: ${{ secrets[format('DISCORD_WEBHOOK_{0}', needs.resolve-config.outputs.channel_key)] }}
          WEBHOOK_URL_VAR: ${{ vars[format('DISCORD_WEBHOOK_{0}', needs.resolve-config.outputs.channel_key)] }}
          ROLE_MENTION_SECRET: ${{ secrets[format('DISCORD_ROLE_MENTION_{0}', needs.resolve-config.outputs.channel_key)] }}
          ROLE_MENTION_VAR: ${{ vars[format('DISCORD_ROLE_MENTION_{0}', needs.resolve-config.outputs.channel_key)] }}
        run: |
          webhook_url="${WEBHOOK_URL_SECRET:-$WEBHOOK_URL_VAR}"
          role_mention="${ROLE_MENTION_VAR:-$ROLE_MENTION_SECRET}"

          if [ -z "$webhook_url" ]; then
            echo "No Discord webhook configured for channel key '$CHANNEL_KEY'. Skipping notification."
            exit 0
          fi

          if [ -n "$role_mention" ]; then
            header="$role_mention "
          else
            header=""
          fi

          modrinth_version_id=$(curl --silent --show-error --fail "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}/version" \
            | jq -r --arg version "$RELEASE_VERSION" '.[] | select(.version_number == $version) | .id' \
            | head -n 1)
          if [ -n "$modrinth_version_id" ]; then
            modrinth_release_url="https://modrinth.com/plugin/${MODRINTH_PROJECT_ID}/version/${modrinth_version_id}"
          else
            modrinth_release_url="https://modrinth.com/plugin/${MODRINTH_PROJECT_ID}/versions"
          fi

          hangar_release_url="https://hangar.papermc.io/${GITHUB_REPOSITORY_OWNER}/${HANGAR_PROJECT_ID}/versions/${RELEASE_VERSION}"

          message=$(printf "%s**MailBox %s** (%s)\n%s\nModrinth: %s\nHangar: %s" \
            "$header" "$RELEASE_VERSION" "$RELEASE_CHANNEL" "$CHANGELOG" "$modrinth_release_url" "$hangar_release_url")

          payload=$(jq -n --arg content "$message" '{content:$content}')
          curl --fail-with-body -X POST -H "Content-Type: application/json" -d "$payload" "$webhook_url"
