plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.14"
    id("com.gradleup.shadow") version "9.0.0-beta8"
}

group = 'net.sabafly'
version = '1.0.0-beta.3'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven { url = "https://repo.codemc.io/repository/maven-snapshots/" }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly("org.xerial:sqlite-jdbc:3.49.0.0")
    compileOnly("com.h2database:h2:2.3.232")
    compileOnly("com.mysql:mysql-connector-j:9.2.0")
    compileOnly("org.spongepowered:configurate-yaml:4.2.0-SNAPSHOT")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7.1")
    implementation("com.zaxxer:HikariCP:6.2.1")
    implementation("com.github.retrooper:packetevents-spigot:2.7.1-SNAPSHOT")
    implementation("commons-dbutils:commons-dbutils:1.8.1")
    compileOnly("org.projectlombok:lombok:1.18.36")
    annotationProcessor("org.projectlombok:lombok:1.18.36")
    paperweight.paperDevBundle("1.21.4-R0.1-SNAPSHOT")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveBaseName = 'MailBox'
    archiveClassifier = ''
    archiveVersion = ""

    dependencies {
        exclude(dependency("org.slf4j:slf4j-api"))
        exclude(dependency("net.kyori:adventure-api"))
        exclude(dependency("net.kyori:adventure-key"))
        exclude(dependency("net.kyori:adventure-nbt"))
        exclude(dependency("net.kyori:examination-api"))
    }

    exclude("plugin.yml")

    minimize()
    relocate("com.zaxxer.hikari", "net.sabafly.libs.com.zaxxer.hikari")
    relocate("org.apache.commons.dbutils", "net.sabafly.libs.org.apache.commons.dbutils")
    relocate("com.github.retrooper.packetevents", "net.sabafly.libs.com.github.retrooper.packetevents")
    relocate("io.github.retrooper.packetevents", "net.sabafly.libs.io.github.retrooper.packetevents")
}

build {
    dependsOn shadowJar
}

tasks {
    runServer {
        //noinspection GroovyMissingReturnStatement
        downloadPlugins {
            url("https://download.luckperms.net/1570/bukkit/loader/LuckPerms-Bukkit-5.4.153.jar")
            github("MilkBowl", "Vault", "1.7.3", "Vault.jar")
            github("Jikoo", "OpenInv", "5.1.9", "OpenInv.jar")
            modrinth("emeraldbank", "0.6.0")
        }
        minecraftVersion("1.21.4")
    }
}
