plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.19"
    id("com.gradleup.shadow") version "9.2.2"
}

group = 'net.sabafly'
version = '1.1.0-alpha.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven { url = "https://repo.codemc.io/repository/maven-snapshots/" }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    implementation(project(":mailbox-api"))
    compileOnly("com.h2database:h2:2.4.240")
    compileOnly("com.mysql:mysql-connector-j:9.5.0")
    compileOnly("org.spongepowered:configurate-yaml:4.3.0-SNAPSHOT")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7.1") {
        transitive = false
    }
    implementation("com.zaxxer:HikariCP:7.0.2"){
        transitive = false
    }
    implementation("commons-dbutils:commons-dbutils:1.8.1")
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    compileOnly('org.apache.commons:commons-lang3:3.20.0')
    implementation("com.vdurmont:semver4j:3.1.0")
    paperweight.paperDevBundle("1.21.8-R0.1-SNAPSHOT")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveBaseName = 'MailBox'
    archiveClassifier = ''
    archiveVersion = "${version}"

    exclude("plugin.yml")

    minimize()
    relocate("com.zaxxer.hikari", "net.sabafly.libs.com.zaxxer.hikari")
    relocate("org.apache.commons.dbutils", "net.sabafly.libs.org.apache.commons.dbutils")
    relocate("com.vdurmont.semver4j", "net.sabafly.libs.com.vdurmont.semver4j")
}

build {
    dependsOn shadowJar
}

tasks {
    runServer {
        //noinspection GroovyMissingReturnStatement
        downloadPlugins {
            github("MilkBowl", "Vault", "1.7.3", "Vault.jar")
            modrinth("luckperms", "v5.5.0-bukkit")
            modrinth("emeraldbank", "1.1.1")
        }
        minecraftVersion("1.21.8")
    }
}
